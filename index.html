<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Smash</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Fruit Smash</h1>
    <section id="instructions">
        <h2>How to play?</h2>
        <p>Remember the fruits and bombs position for 5 seconds </p>
        <p>Click the hidden fruits to earn points</p>
        <p>Avoid the bombs or you will lose life</p>
        <p>Complete 30 rounds to win</p>
    </section>
    <section id="game-info">
        <p>Round: <span id="round">1/30</span></p>
        <p>Score: <span id="score">0</span></p>
        <p>Lives: <span id="lives">3</span></p>
        <p>Timer: <span id="timer">3s</span></p>
    </section>
    <button id="start">Start game</button>
    <p id="message">Click Start Game to play!</p>
    <section id="board">
        <div class="card">🍑</div>
        <div class="card">🍎</div>
        <div class="card">💣</div>
        <div class="card">🥝</div>
        <div class="card">💣</div>
        <div class="card">🍋</div>
        <div class="card">🍉</div>
        <div class="card">💣</div>
        <div class="card">🍍</div>
    </section>
    <button id="reset">Restart Game</button>
</body>
</html>
